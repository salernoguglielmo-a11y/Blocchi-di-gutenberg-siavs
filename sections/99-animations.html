<!-- ==========================================================
     ANIMAZIONI — reveal-on-scroll + count-up KPI
     Da incollare UNA SOLA VOLTA, in fondo alla pagina
     (oppure in functions.php / Code Snippets, vedi note sotto)
     ========================================================== -->

<!-- wp:html -->
<style>
	.siavs-reveal {
		opacity: 0;
		transform: translateY(24px);
		transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
		will-change: opacity, transform;
	}
	.siavs-reveal.is-visible {
		opacity: 1;
		transform: translateY(0);
	}
	@media (prefers-reduced-motion: reduce) {
		.siavs-reveal,
		.siavs-reveal.is-visible {
			opacity: 1 !important;
			transform: none !important;
			transition: none !important;
		}
	}
</style>

<script>
(function () {
	var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

	// ---------- Reveal on scroll ----------
	var revealEls = document.querySelectorAll('.siavs-reveal');
	if (prefersReduced || !('IntersectionObserver' in window)) {
		revealEls.forEach(function (el) { el.classList.add('is-visible'); });
	} else {
		var revealObserver = new IntersectionObserver(function (entries) {
			entries.forEach(function (entry) {
				if (entry.isIntersecting) {
					entry.target.classList.add('is-visible');
					revealObserver.unobserve(entry.target);
				}
			});
		}, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
		revealEls.forEach(function (el) { revealObserver.observe(el); });
	}

	// ---------- Count-up KPI ----------
	function animateCount(el) {
		var raw = (el.textContent || '').trim();
		var match = raw.match(/^(\d+)(\+?)$/);
		if (!match) return;
		var target = parseInt(match[1], 10);
		var suffix = match[2] || '';
		var duration = 1400;
		var start = null;
		el.textContent = '0' + suffix;
		function step(ts) {
			if (!start) start = ts;
			var p = Math.min((ts - start) / duration, 1);
			var eased = 1 - Math.pow(1 - p, 3);
			el.textContent = Math.floor(eased * target) + suffix;
			if (p < 1) requestAnimationFrame(step);
			else el.textContent = target + suffix;
		}
		requestAnimationFrame(step);
	}

	var kpiEls = document.querySelectorAll('.siavs-kpi');
	if (!prefersReduced && 'IntersectionObserver' in window) {
		var kpiObserver = new IntersectionObserver(function (entries) {
			entries.forEach(function (entry) {
				if (entry.isIntersecting) {
					animateCount(entry.target);
					kpiObserver.unobserve(entry.target);
				}
			});
		}, { threshold: 0.5 });
		kpiEls.forEach(function (el) { kpiObserver.observe(el); });
	}
})();
</script>
<!-- /wp:html -->
